
# --- vbg.hsy-stems.com ---
server {
    listen 80;
    listen [::]:80;
    server_name vbg.hsy-stems.com www.vbg.hsy-stems.com;

    root /var/www/hsy-stems.com/vbg/public;
    index index.html;

    # SPA fallback for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # backend forwarding - vbg-backend runs on 3010 (3000 is taken by wof, 3001 was already in use)
    location /api {
        proxy_pass http://localhost:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # backend also serves Swagger docs at /docs - only reachable if you want it public
    location /docs {
        proxy_pass http://localhost:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
